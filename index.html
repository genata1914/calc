<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прост Калкулатор</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="calculator" data-theme="light">
        <header class="toolbar">
            <button id="theme-toggle" aria-label="Смени тема">Смени тема</button>
            <button id="mode-toggle" aria-label="Научен режим">Научен режим</button>
        </header>
        <section class="display">
            <input id="expression" type="text" placeholder="0" readonly>
            <div id="result">0</div>
        </section>
        <section class="buttons">
            <div class="button-grid basic">
                <button data-action="clear">C</button>
                <button data-value="(">(</button>
                <button data-value=")">)</button>
                <button data-action="backspace">⌫</button>
                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button data-value="/">÷</button>
                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button data-value="*">×</button>
                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button data-value="-">−</button>
                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button data-action="calculate" class="equals">=</button>
                <button data-value="+">+</button>
            </div>
            <div class="button-grid scientific hidden">
                <button data-func="Math.sin">sin</button>
                <button data-func="Math.cos">cos</button>
                <button data-func="Math.tan">tan</button>
                <button data-func="Math.sqrt">√</button>
                <button data-func="Math.pow" data-args="2">x²</button>
                <button data-func="Math.pow" data-args="3">x³</button>
                <button data-func="Math.log">ln</button>
                <button data-func="Math.exp">eˣ</button>
            </div>
        </section>
        <section class="history">
            <h2>История</h2>
            <ul id="history-list"></ul>
            <button id="clear-history">Изчисти историята</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
